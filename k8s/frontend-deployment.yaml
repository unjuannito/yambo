apiVersion: apps/v1
kind: Deployment
metadata:
  name: yambo-frontend
  namespace: yambo
  labels:
    app: yambo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yambo-frontend
  template:
    metadata:
      labels:
        app: yambo-frontend
    spec:
      containers:
        - name: frontend
          image: 192.168.1.11:5000/yambo-web-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: yambo-frontend-service
  namespace: yambo
spec:
  selector:
    app: yambo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
