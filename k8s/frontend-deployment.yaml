apiVersion: apps/v1
kind: Deployment
metadata:
  name: yambo-frontend
  namespace: yambo
  labels:
    app: yambo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yambo-frontend
  template:
    metadata:
      labels:
        app: yambo-frontend
    spec:
      containers:
        - name: frontend
          image: 192.168.1.11:5000/yambo-web-frontend:latest
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://yambo-backend-service:8080/api"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "160Mi"
              cpu: "125m"
            limits:
              memory: "448Mi"
              cpu: "350m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: yambo-frontend-service
  namespace: yambo
spec:
  selector:
    app: yambo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
