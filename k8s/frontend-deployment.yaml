apiVersion: apps/v1
kind: Deployment
metadata:
  name: yambo-frontend
  namespace: yambo
  labels:
    app: yambo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yambo-frontend
  template:
    metadata:
      labels:
        app: yambo-frontend
    spec:
      containers:
        # Node.js SSR server
        - name: frontend
          image: 192.168.1.11:5000/yambo-web-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://yambo-backend-service:8080/api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
        # Nginx reverse proxy sidecar
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
      volumes:
        - name: nginx-config
          configMap:
            name: yambo-frontend-nginx-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: yambo-frontend-nginx-config
  namespace: yambo
data:
  default.conf: |
    upstream ssr_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 15M;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        location /uploads/ {
            proxy_pass http://yambo-backend-service:8080/api/uploads/;
            client_max_body_size 15M;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            proxy_pass http://ssr_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }
---
apiVersion: v1
kind: Service
metadata:
  name: yambo-frontend-service
  namespace: yambo
spec:
  selector:
    app: yambo-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
