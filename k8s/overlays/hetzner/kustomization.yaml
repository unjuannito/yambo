apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Overlay PRODUCCIÓN: Hetzner CX33 ─────────────────────────────────────
# Aplicado por Jenkinsfile (rama main/master) con KUBECONFIG hetzner.
# Imágenes → registry local vía NetBird (100.111.131.248:5000).
# El Secret se gestiona aparte (no se re-aplica salvo FORCE_PROD_DEPLOY).

namespace: yambo

resources:
  - ../../base

# Imágenes → registry.cabrasky.net. Los newTag los reescribe Jenkins
# (stage 'Update Image Tag (GitOps)') con el tag recién construido; Argo CD
# sincroniza ese commit. No reordenar name → newName → newTag.
images:
  - name: yambo-web-frontend
    newName: registry.cabrasky.net/yambo-web-frontend
    newTag: "1.19.0"
  - name: yambo-web-backend
    newName: registry.cabrasky.net/yambo-web-backend
    newTag: "1.19.0"

# ── DOMINIO ──────────────────────────────────────────────────────────────
# Único sitio donde se escribe el dominio de este entorno. Para cambiarlo basta
# con esta línea; los `replacements` de abajo lo llevan al Ingress, al CORS del
# backend y al FRONTEND_URL (canonical, sitemap, Open Graph). Ver README,
# «Cambiar de dominio», para el resto de pasos (DNS, OAuth, Search Console).
configMapGenerator:
  - name: yambo-domain
    literals:
      - host=yambo.cabrasky.net
    options:
      disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: yambo-domain
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
          name: yambo-ingress
        fieldPaths:
          - spec.rules.0.host
      - select:
          kind: Deployment
          name: yambo-backend
        fieldPaths:
          - spec.template.spec.containers.0.env.0.value
        options:
          delimiter: "//"
          index: 1
      - select:
          kind: Deployment
          name: yambo-frontend
        fieldPaths:
          - spec.template.spec.containers.0.env.1.value
        options:
          delimiter: "//"
          index: 1

patches:
  # Dominio: DOMAIN se sustituye por el de `yambo-domain` (arriba)
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: DOMAIN
    target:
      kind: Ingress
      name: yambo-ingress
  # CORS backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://DOMAIN"
    target:
      kind: Deployment
      name: yambo-backend
  # FRONTEND_URL
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "https://DOMAIN"
    target:
      kind: Deployment
      name: yambo-frontend
  # Replicas para HA
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: yambo-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: yambo-frontend
