apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Overlay PRODUCCIÓN: Hetzner CX33 ─────────────────────────────────────
# Aplicado por Jenkinsfile (rama main/master) con KUBECONFIG hetzner.
# Las imágenes se inyectan por el pipeline: kustomize edit set image.

namespace: yambo

resources:
  - ../../base

# Las imágenes se inyectan en CI con:
#   kustomize edit set image \
#     <REGISTRY>/yambo-web-frontend=<REGISTRY>/yambo-web-frontend:<tag> \
#     <REGISTRY>/yambo-web-backend=<REGISTRY>/yambo-web-backend:<tag>
images:
  - name: 192.168.1.21:5000/yambo-web-frontend
    newTag: latest
  - name: 192.168.1.21:5000/yambo-web-backend
    newTag: latest

patches:
  # Dominio real de producción
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: yambo.cabrasky.net
    target:
      kind: Ingress
      name: yambo-ingress
  # CORS backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-backend
  # FRONTEND_URL
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-frontend
  # Replicas para HA
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: yambo-backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: yambo-frontend
