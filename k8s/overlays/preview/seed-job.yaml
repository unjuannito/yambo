# Seed job template for preview environments.
# The pipeline creates the ConfigMap preview-seed-sql before applying this,
# then waits: kubectl wait --for=condition=complete job/preview-seed -n <ns> --timeout=600s
apiVersion: batch/v1
kind: Job
metadata:
  name: preview-seed
  labels:
    yambo/preview: "true"
spec:
  ttlSecondsAfterFinished: 7200
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_PASS
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_USER
          command:
            - sh
            - -c
            - |
              until pg_isready -h db -U "$PGUSER" -d yambo_db; do
                echo "Postgres not ready, retrying in 10s..."
                sleep 10
              done
              echo "Postgres is ready."
      containers:
        - name: seed-loader
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_PASS
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_USER
          command:
            - sh
            - -c
            - |
              echo "Restoring preview database dump..."
              psql -h db -U "$PGUSER" -d yambo_db -v ON_ERROR_STOP=1 -f /seed/preview-seed.sql
              echo "Done."
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: seed-sql
          configMap:
            name: preview-seed-sql
