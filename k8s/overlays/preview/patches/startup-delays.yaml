# Longer probe delays for preview environments:
# - DB seeding can take minutes
# - startup probe allows up to 5 min (30 * 10s) before marking as failed
# Backend
- op: replace
  path: /spec/template/spec/containers/0/startupProbe
  value:
    httpGet:
      path: /api/health
      port: 8080
    failureThreshold: 30
    periodSeconds: 10
- op: replace
  path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
  value: 90
- op: replace
  path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
  value: 120
