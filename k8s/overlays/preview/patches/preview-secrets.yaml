# Overrides the yambo-secrets Secret for preview environments:
# - Mail is disabled (points to localhost so no emails are actually sent)
# - DB credentials stay the same (generated per-namespace by the pipeline)
# - JWT_SECRET stays the same (not sensitive in an isolated preview)
apiVersion: v1
kind: Secret
metadata:
  name: yambo-secrets
type: Opaque
stringData:
  MAIL_HOST: "localhost"
  MAIL_USERNAME: "preview"
  MAIL_PASSWORD: "preview"
  MAIL_FROM: "noreply@preview.invalid"
