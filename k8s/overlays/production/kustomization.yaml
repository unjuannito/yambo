apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yambo

resources:
  - ../../base

# Image tags are set by the CI pipeline:
#   kustomize edit set image \
#     192.168.1.21:5000/yambo-web-frontend=192.168.1.21:5000/yambo-web-frontend:1.2.3 \
#     192.168.1.21:5000/yambo-web-backend=192.168.1.21:5000/yambo-web-backend:1.2.3
images:
  - name: 192.168.1.21:5000/yambo-web-frontend
    newTag: latest
  - name: 192.168.1.21:5000/yambo-web-backend
    newTag: latest

patches:
  # Set replicas to 2 for HA
  - path: patches/backend-replicas.yaml
  - path: patches/frontend-replicas.yaml
  # Patch real domain into ingress, backend CORS, and frontend FRONTEND_URL
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-frontend
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: yambo.cabrasky.net
    target:
      kind: Ingress
      name: yambo-ingress
