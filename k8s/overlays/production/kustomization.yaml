apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yambo

resources:
  - ../../base

images:
  - name: yambo-web-frontend
    newName: 100.111.131.248:5000/yambo-web-frontend
    newTag: latest
  - name: yambo-web-backend
    newName: 100.111.131.248:5000/yambo-web-backend
    newTag: latest

patches:
  # 2 réplicas para HA en producción
  - path: patches/backend-replicas.yaml
  - path: patches/frontend-replicas.yaml
  # Dominio real en ingress, CORS y FRONTEND_URL
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-backend
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "https://yambo.cabrasky.net"
    target:
      kind: Deployment
      name: yambo-frontend
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: yambo.cabrasky.net
    target:
      kind: Ingress
      name: yambo-ingress
