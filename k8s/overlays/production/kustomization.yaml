apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: yambo

resources:
  - ../../base

# Image tags are set by the CI pipeline:
#   kustomize edit set image \
#     192.168.1.11:5000/yambo-web-frontend=192.168.1.11:5000/yambo-web-frontend:1.2.3 \
#     192.168.1.11:5000/yambo-web-backend=192.168.1.11:5000/yambo-web-backend:1.2.3
images:
  - name: 192.168.1.11:5000/yambo-web-frontend
    newTag: latest
  - name: 192.168.1.11:5000/yambo-web-backend
    newTag: latest

patches:
  # Set replicas to 2 for HA
  - path: patches/backend-replicas.yaml
  - path: patches/frontend-replicas.yaml
  # Patch real domain into ingress, backend CORS, and frontend FRONTEND_URL
  - path: patches/domain.yaml
