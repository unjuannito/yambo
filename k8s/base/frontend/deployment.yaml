apiVersion: apps/v1
kind: Deployment
metadata:
  name: yambo-frontend
  namespace: yambo
  labels:
    app: yambo-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yambo-frontend
  template:
    metadata:
      labels:
        app: yambo-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: yambo-frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: 192.168.1.11:5000/yambo-web-frontend:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://yambo-backend-service:8080/api"
            # FRONTEND_URL set to real domain via overlay patch
            - name: FRONTEND_URL
              value: "OVERLAY_PATCH_REQUIRED"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "160Mi"
              cpu: "125m"
            limits:
              memory: "448Mi"
              cpu: "350m"
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
