# StatefulSet for Postgres — guarantees stable network identity and
# ordered start/stop. volumeClaimTemplates replaces the separate PVC resource.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: yambo
  labels:
    app: postgres
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The official postgres image starts as root to initialize the data
      # directory and then drops to the postgres user internally. Pod-level
      # runAsNonRoot/runAsUser must not be set or the entrypoint will fail.
      containers:
        - name: postgres
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "yambo_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yambo-secrets
                  key: DB_PASS
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d yambo_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d yambo_db"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
