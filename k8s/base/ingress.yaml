apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yambo-ingress
  namespace: yambo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Allow large file uploads (images, ~15 MB)
    traefik.ingress.kubernetes.io/buffering-maxrequestbodybytes: "15728640"
    # cert-manager issues and renews TLS certificates automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - OVERLAY_PATCH_REQUIRED
      secretName: yambo-tls-cert
  defaultBackend:
    service:
      name: yambo-frontend-service
      port:
        number: 80
  rules:
    - host: OVERLAY_PATCH_REQUIRED
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: yambo-backend-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yambo-frontend-service
                port:
                  number: 80
