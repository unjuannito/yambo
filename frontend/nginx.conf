upstream ssr_backend {
    server 127.0.0.1:3000;
}

# Cache zone for public SSR pages
proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=public_ssr:10m max_size=100m inactive=10m;

server {
    listen 80;
    server_name _;

    # Allow large file uploads
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static client assets directly (hashed filenames => long cache)
    location /assets/ {
        root /app/build/client;
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # Serve other static files from client build (favicon, robots.txt, etc.)
    location /favicon.ico {
        root /app/build/client;
        access_log off;
    }

    # Proxy uploaded files to backend
    # BACKEND_INTERNAL_URL is substituted at container start by the entrypoint
    location /uploads/ {
        proxy_pass ${BACKEND_INTERNAL_URL}/uploads/;
        client_max_body_size 100M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Strip trailing slashes → 301 redirect to canonical URL (SEO)
    rewrite ^(.+)/$ $1 permanent;

    # Cached public SSR pages (listing + detail pages)
    location ~ ^/(actividades|contacto|monitores|proyectos)(/[^/]+)?$ {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache public_ssr;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # All other requests → Node.js SSR server
    location / {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP: unsafe-inline required for React SSR hydration scripts and dynamic styles.
    # wasm-unsafe-eval required for WebAssembly (e.g. webserial polyfill).
    # wss: in connect-src allows WebSocket upgrades over TLS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;
}
