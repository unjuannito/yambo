upstream ssr_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name _;

    # Allow large file uploads
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static client assets directly (hashed filenames => long cache)
    location /assets/ {
        root /app/build/client;
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform";
        access_log off;
    }

    # Serve other static files from client build (favicon, robots.txt, etc.)
    location /favicon.ico {
        root /app/build/client;
        access_log off;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://yambo-backend-service:8080/api/uploads/;
        client_max_body_size 100M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # All other requests → Node.js SSR server
    location / {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
