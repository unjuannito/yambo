sonar.projectKey=yambo-frontend
sonar.projectName=yambo-frontend
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# tsconfig compatible con SonarJS 9.9 (el tsconfig del proyecto usa moduleResolution:bundler, no soportado por el eslint-bridge)
sonar.typescript.tsconfigPaths=sonar-tsconfig.json
