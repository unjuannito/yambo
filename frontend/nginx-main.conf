# Main nginx config for non-root container execution.
# Replaces the Alpine-default /etc/nginx/nginx.conf which uses
# /var/lib/nginx/logs/ and /var/lib/nginx/tmp/ — both inaccessible
# to non-root users unless pre-created with correct ownership.
# All writable paths are redirected to /tmp (always writable).

worker_processes auto;
pcre_jit on;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;

    # Redirect all temp file paths to /tmp so nginx can write them as any UID
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    sendfile   on;
    tcp_nopush on;

    gzip         on;
    gzip_vary    on;
    gzip_proxied any;

    include /etc/nginx/http.d/*.conf;
}
