name: Design issue
description: Issues relacionados con el diseño de la web
title: "DESIGN - "
labels: ["design"]
assignees: ["tu-usuario-o-equipo"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Explica con detalle el objetivo, contexto y alcance funcional.
      placeholder: "Se quiere..."
    validations:
      required: false

  - type: textarea
    id: technical-requirements
    attributes:
      label: todo
      description: Explica en pasos que se necesita hacer en el issue.
      placeholder: "- [ ] Crear..."
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Aceptance criteria
      description: Explica con detalle lo que se necesita para dar como valido el desarrollo.
      placeholder: "- [ ] Probar que funciona el.."
    validations:
      required: false