<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{emails/layout/base-email}">
<head>
    <title>Estado de Incidencia Actualizado</title>
</head>
<body>
<table><tr>
<td style="padding: 40px 30px;" layout:fragment="content">
    <h2 style="margin: 0 0 20px 0; color: #2c3e50; font-size: 24px;">¡Hola <span th:text="${userName}"></span>!</h2>
    <p style="margin: 0 0 20px 0; color: #555555; font-size: 16px; line-height: 1.6;">
        El estado de una incidencia ha sido actualizado.
    </p>

    <th:block th:replace="~{emails/fragments/layout :: issueDetails(${issueId}, ${issueTitle}, ${productName})}"/>

    <!-- Status Change -->
    <div style="background-color: #fff8e1; border-left: 4px solid #f39c12; padding: 15px 20px; margin: 20px 0;">
        <p style="margin: 0 0 10px 0; color: #555555; font-size: 14px;">
            <strong>Cambio de estado por <span th:text="${changedBy}"></span></strong>
        </p>
        <p style="margin: 0 0 10px 0; color: #555555; font-size: 13px;">
            <em th:text="${#temporals.format(changedAt, 'dd/MM/yyyy HH:mm')}"></em>
        </p>
        <p style="margin: 0; color: #555555; font-size: 15px;">
            <span th:text="${oldStatusText}" style="text-decoration: line-through;">Abierto</span>
            <span style="margin: 0 10px;">➜</span>
            <span th:text="${newStatusText}" th:style="'color: ' + ${statusColor} + '; font-weight: bold;'">En Progreso</span>
        </p>
    </div>

    <p style="margin: 20px 0; color: #555555; font-size: 16px; line-height: 1.6;">
        Puedes ver todos los detalles de la incidencia desde tu panel de control.
    </p>

    <th:block th:replace="~{emails/fragments/layout :: ctaButton(${issueLink}, 'Ver Incidencia', '#3498db')}"/>
</td>
</tr></table>
</body>
</html>
