version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DATABASE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-yambo_db}
      - DB_USER=${DB_USER:-yambo_user}
      - DB_PASS=${DB_PASS:-yambo_pass}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
      - "${BACKEND_PORT:-8080}:8080"
      - "80:80"
    depends_on:
      - db
    command: sleep infinity

  db:
    image: postgres:${POSTGRES_VERSION:-14}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-yambo_db}
      - POSTGRES_USER=${DB_USER:-yambo_user}
      - POSTGRES_PASSWORD=${DB_PASS:-yambo_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  postgres_data:
