apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yambo-prod
  namespace: argocd
spec:
  project: default
  # El tag de imagen lo fija Jenkins en el kustomization.yaml del overlay
  # (commit a la rama main tras cada build) → Argo CD despliega ese tag exacto.
  source:
    repoURL: https://github.com/unjuannito/yambo
    targetRevision: main
    path: k8s/overlays/hetzner
  destination:
    # Cluster Hetzner prod (añadido a Argo CD vía VPN NetBird, IP overlay)
    server: https://100.111.166.119:6443
    namespace: yambo
  syncPolicy:
    # PROD arranca en sync MANUAL a propósito: revisa el diff y sincroniza
    # a mano hasta validar el flujo. Cambiar a automated cuando haya confianza.
    syncOptions:
      - CreateNamespace=true
